version: "3.8"

services:
  #Node.js application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: devops-app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.production
    volumes:
      #mount logs directory for development
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
