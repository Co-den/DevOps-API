services:
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: devops-api-neon-local
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    environment:
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      PARENT_BRANCH: ${PARENT_BRANCH}
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_LOCAL_HOST: ${NEON_LOCAL_HOST}
      NEON_LOCAL_PORT: ${NEON_LOCAL_PORT}
    volumes:
      #persistant branch metadata per git branch (optional)
      - ./.neon_local/:/tmp/.neon_local
      - ./.git/HEAD:/tmp/.git/HEAD:ro,consistent
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "neon"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - devops-dev
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: devops-app
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - devops-dev

networks:
  devops-dev:
    driver: bridge
